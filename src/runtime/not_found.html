<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Page not found</title>
    <style>
      /* Mirrors the lesson UI palette in web/src/styles.css. Self-contained so
         it renders even when the bundled assets are what went missing. */
      :root {
        --ink: #262421;
        --muted: #6b665e;
        --paper: #fffdf8;
        --line: #d8d0c4;
        --accent: #315c49;
        color: var(--ink);
        background: #f4f0e8;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #eee9df;
          --muted: #b4aea4;
          --paper: #282b29;
          --line: #4b504c;
          --accent: #8bc6a7;
          background: #1e201f;
        }
      }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; padding: 1rem; place-items: center; }
      main {
        width: min(100%, 34rem);
        padding: 2.25rem 2rem;
        border: 1px solid var(--line);
        border-radius: .55rem;
        background: var(--paper);
      }
      .eyebrow {
        margin: 0 0 .75rem;
        color: var(--accent);
        font-size: .78rem;
        font-weight: 750;
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 1rem;
        font-family: Georgia, Cambria, serif;
        font-size: clamp(1.9rem, 6vw, 2.6rem);
        line-height: 1.05;
      }
      p { margin: 0 0 1.5rem; color: var(--muted); line-height: 1.6; }
      code {
        padding: .12em .35em;
        border-radius: .25rem;
        background: color-mix(in srgb, var(--line) 45%, transparent);
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: .9em;
        overflow-wrap: anywhere;
      }
      a {
        display: inline-block;
        padding: .55rem .95rem;
        border-radius: .4rem;
        background: var(--accent);
        color: var(--paper);
        font-weight: 650;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 · Not found</p>
      <h1>This page isn’t part of the lesson</h1>
      <p>
        The lesson has a single page, so <code>{{path}}</code> doesn’t exist.
        If you reached this from an open tab after rebuilding <code>learn</code>,
        reloading the lesson fetches the current assets.
      </p>
      <a href="/">Back to the lesson</a>
    </main>
  </body>
</html>
