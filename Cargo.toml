[package]
name = "agent-teacher"
version = "1.11.0"
edition = "2024"
rust-version = "1.85"
description = "Compile and serve local, agent-authored interactive lessons"
readme = "README.md"
publish = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/config.example.toml",
    "/build.rs",
    "/README.md",
    "/docs/**",
    "/examples/**",
    "/src/**",
    "/tests/**",
    "/web/dist/**",
]

[lib]
name = "agent_teacher"
path = "src/lib.rs"

[[bin]]
name = "learnc"
path = "src/bin/learnc.rs"

[[bin]]
name = "learn"
path = "src/bin/learn.rs"

[[bin]]
name = "learnpick"
path = "src/bin/learnpick.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
mime_guess = "2"
mermaid-svg = "=0.7.0"
rust-embed = "8"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
toml = "0.8"
ureq = { version = "3.4", features = ["json"] }
webbrowser = "1"
